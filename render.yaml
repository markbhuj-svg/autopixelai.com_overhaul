services:
  - type: web
    name: autopixelai-overhaul
    runtime: node
    branch: main
    plan: starter
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '24.15.0'
      - key: GOOGLE_SMTP_USER
        sync: false
      - key: GOOGLE_SMTP_APP_PASSWORD
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: Autobg_API_KEY
        sync: false
      - key: DEMO_JOB_SECRET
        sync: false
